name: Weekly note stats

on:
  schedule:
    # Every Monday 09:05 JST. The script collects the previous completed week.
    - cron: '5 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
      NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
      NOTE_TARGET_WEEK: previous
      NOTE_OUTPUT_DIR: data
      HEADLESS: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run collect

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No CSV changes."
          else
            git commit -m "Add weekly note stats"
            git push
          fi
